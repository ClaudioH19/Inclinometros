services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: clinostato-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  app:
    build: .
    container_name: clinostato-app
    restart: unless-stopped
    depends_on:
      - mqtt
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data

volumes:
  mosquitto_data:
  mosquitto_log:
